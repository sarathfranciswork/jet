appId: com.jet.desktop
productName: Jet
copyright: Copyright © 2024 Jet Team

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - src/renderer/**/*
  - assets/**/*
  - "!**/*.ts"
  - "!**/*.map"

extraResources:
  - from: assets/
    to: assets/
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: "Sarath Francis (H845PX7Q62)"
  notarize:
    teamId: "H845PX7Q62"
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  artifactName: Jet-${version}-${arch}.dmg
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Jet-Setup-${version}.exe

linux:
  icon: assets/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: Jet-${version}.AppImage

deb:
  artifactName: jet_${version}_amd64.deb

publish:
  provider: github
  owner: jet-pm
  repo: jet
  releaseType: release
