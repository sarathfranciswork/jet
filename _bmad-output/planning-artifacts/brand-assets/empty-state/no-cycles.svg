<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <pattern id="blueprint" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <line x1="0" y1="20" x2="20" y2="20" stroke="#3B82F6" stroke-width="0.3" opacity="0.1"/>
      <line x1="20" y1="0" x2="20" y2="20" stroke="#3B82F6" stroke-width="0.3" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#blueprint)"/>
  <!-- Cycle/refresh arrows -->
  <path d="M 200 80 A 40 40 0 1 1 160 120" stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.5"/>
  <polygon points="158,112 160,124 170,116" fill="#3B82F6" opacity="0.5"/>
  <path d="M 200 160 A 40 40 0 1 1 240 120" stroke="#06B6D4" stroke-width="1.5" fill="none" opacity="0.4"/>
  <polygon points="242,128 240,116 230,124" fill="#06B6D4" opacity="0.4"/>
  <!-- Speed accents -->
  <line x1="100" y1="120" x2="120" y2="120" stroke="#3B82F6" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
  <line x1="280" y1="120" x2="300" y2="120" stroke="#06B6D4" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
  <text x="200" y="210" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="18" fill="#A1A1AA">No cycles yet</text>
  <text x="200" y="236" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="14" fill="#71717A">Plan your first sprint to build momentum</text>
</svg>
