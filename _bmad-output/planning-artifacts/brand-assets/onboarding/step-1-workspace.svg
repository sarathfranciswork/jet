<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#3B82F6" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="480" height="320" fill="#09090B"/>
  <rect width="480" height="320" fill="url(#grid)"/>
  <!-- Workspace card -->
  <rect x="140" y="60" width="200" height="140" rx="8" stroke="#3B82F6" stroke-width="1.5" fill="#18181B" opacity="0.8"/>
  <!-- Logo in card -->
  <g transform="translate(210, 80) scale(0.08)">
    <path d="M 288 64 L 352 64 L 352 320 C 352 380 320 420 272 448 L 160 448 L 192 384 L 264 384 C 296 384 288 352 288 320 Z" fill="#3B82F6"/>
    <path d="M 160 64 L 368 64 L 336 128 L 160 128 Z" fill="#3B82F6"/>
  </g>
  <!-- Input field mock -->
  <rect x="165" y="130" width="150" height="30" rx="4" stroke="#3F3F46" stroke-width="1" fill="#27272A"/>
  <text x="175" y="150" font-family="'Inter', sans-serif" font-size="11" fill="#71717A">My Workspace</text>
  <!-- Button mock -->
  <rect x="185" y="172" width="110" height="28" rx="4" fill="#3B82F6"/>
  <text x="212" y="191" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="white">Create</text>
  <!-- Step indicator -->
  <circle cx="220" cy="260" r="5" fill="#3B82F6"/>
  <circle cx="240" cy="260" r="5" fill="#3F3F46"/>
  <circle cx="260" cy="260" r="5" fill="#3F3F46"/>
  <text x="240" y="295" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#A1A1AA">Create your workspace</text>
</svg>
