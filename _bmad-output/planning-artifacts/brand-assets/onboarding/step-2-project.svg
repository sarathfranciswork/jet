<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#3B82F6" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="480" height="320" fill="#09090B"/>
  <rect width="480" height="320" fill="url(#grid)"/>
  <!-- Project cards -->
  <rect x="80" y="60" width="140" height="100" rx="6" stroke="#3B82F6" stroke-width="1.5" fill="#18181B"/>
  <rect x="95" y="78" width="14" height="14" rx="3" fill="#3B82F6" opacity="0.5"/>
  <text x="115" y="90" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#FAFAFA">Project Alpha</text>
  <rect x="95" y="100" width="80" height="4" rx="2" fill="#27272A"/>
  <rect x="95" y="110" width="60" height="4" rx="2" fill="#27272A"/>
  <rect x="95" y="128" width="40" height="16" rx="3" fill="#3B82F6" opacity="0.15"/>
  <text x="100" y="140" font-family="'Inter', sans-serif" font-size="9" fill="#3B82F6">3 issues</text>
  <rect x="260" y="60" width="140" height="100" rx="6" stroke="#3F3F46" stroke-width="1" fill="#18181B" stroke-dasharray="4 4"/>
  <text x="310" y="115" font-family="'Inter', sans-serif" font-size="24" fill="#3F3F46">+</text>
  <!-- Step indicator -->
  <circle cx="220" cy="230" r="5" fill="#3F3F46"/>
  <circle cx="240" cy="230" r="5" fill="#3B82F6"/>
  <circle cx="260" cy="230" r="5" fill="#3F3F46"/>
  <text x="240" y="270" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#A1A1AA">Set up your first project</text>
</svg>
