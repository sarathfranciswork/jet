<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#3B82F6" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="480" height="320" fill="#09090B"/>
  <rect width="480" height="320" fill="url(#grid)"/>
  <!-- Team members -->
  <circle cx="190" cy="100" r="24" stroke="#3B82F6" stroke-width="1.5" fill="#18181B"/>
  <circle cx="190" cy="92" r="8" fill="#3B82F6" opacity="0.4"/>
  <path d="M 174 112 Q 190 120 206 112" stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="240" cy="85" r="24" stroke="#06B6D4" stroke-width="1.5" fill="#18181B"/>
  <circle cx="240" cy="77" r="8" fill="#06B6D4" opacity="0.4"/>
  <path d="M 224 97 Q 240 105 256 97" stroke="#06B6D4" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="290" cy="100" r="24" stroke="#3F3F46" stroke-width="1.5" fill="#18181B" stroke-dasharray="4 4"/>
  <text x="290" y="106" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#3F3F46">+</text>
  <!-- Email input mock -->
  <rect x="150" y="155" width="180" height="30" rx="4" stroke="#3F3F46" stroke-width="1" fill="#27272A"/>
  <text x="162" y="175" font-family="'Inter', sans-serif" font-size="11" fill="#71717A">teammate@company.com</text>
  <!-- Invite button -->
  <rect x="185" y="198" width="110" height="28" rx="4" fill="#3B82F6"/>
  <text x="210" y="217" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="white">Invite team</text>
  <!-- Step indicator -->
  <circle cx="220" cy="260" r="5" fill="#3F3F46"/>
  <circle cx="240" cy="260" r="5" fill="#3F3F46"/>
  <circle cx="260" cy="260" r="5" fill="#3B82F6"/>
  <text x="240" y="295" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#A1A1AA">Invite your team</text>
</svg>
