name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'assigned' && github.event.assignee.login == 'claude[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-20250514"
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          direct_prompt: |
            You are working on the Jet project (a project management tool rebranded from Plane).

            When implementing features:
            1. Read and understand the existing codebase patterns before making changes
            2. Follow the existing code style (Django backend, Next.js/TypeScript frontend)
            3. Create a feature branch with a descriptive name
            4. Make the implementation changes
            5. Run any available tests
            6. Create a pull request with a clear description

            Project structure:
            - Backend: apiserver/jet/ (Django + Celery)
            - Frontend: web/ (Next.js + TypeScript + MobX)
            - Deployment: Docker Compose on GCP
