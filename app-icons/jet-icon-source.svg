<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Surface colors matching the reference image -->
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ED8E8"/>
      <stop offset="100%" stop-color="#A5E4F0"/>
    </linearGradient>
    <linearGradient id="frontFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BC4D6"/>
      <stop offset="100%" stop-color="#5BB8CC"/>
    </linearGradient>
    <linearGradient id="sideFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A9BAD"/>
      <stop offset="100%" stop-color="#3D8899"/>
    </linearGradient>
    <linearGradient id="innerShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3040"/>
      <stop offset="100%" stop-color="#0F2030"/>
    </linearGradient>
    <linearGradient id="deepShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#152535"/>
      <stop offset="100%" stop-color="#0A1520"/>
    </linearGradient>
  </defs>

  <!-- Black background -->
  <rect width="1024" height="1024" fill="#09090B"/>

  <!-- 3D Isometric J Letter -->
  <!-- The J is composed of multiple polygons to create 3D isometric effect -->

  <g transform="translate(512, 512) scale(0.75) translate(-512, -512)">
    <!-- Back/bottom shadow layer -->
    <!-- Inner cavity (dark recessed area) -->
    <polygon points="480,280 720,280 720,580 640,640 480,640 480,580 560,580 560,340 480,340"
             fill="url(#deepShadow)"/>

    <!-- Right side face of vertical stroke -->
    <polygon points="560,140 620,100 620,540 560,580 560,340 560,140"
             fill="url(#sideFace)"/>

    <!-- Right side face of bottom horizontal -->
    <polygon points="720,580 780,540 780,480 720,520 720,580"
             fill="url(#sideFace)"/>

    <!-- Right side face of right vertical -->
    <polygon points="720,280 780,240 780,540 720,580 720,280"
             fill="url(#sideFace)"/>

    <!-- Front face - left vertical stroke (tall part of J) -->
    <polygon points="400,180 560,180 560,580 480,640 400,640 400,180"
             fill="url(#frontFace)"/>

    <!-- Front face - bottom horizontal stroke -->
    <polygon points="480,640 720,640 720,520 640,580 480,580 480,640"
             fill="url(#frontFace)"/>

    <!-- Front face - right vertical (short part) -->
    <polygon points="640,280 720,280 720,520 640,580 640,280"
             fill="#5BB8CC"/>

    <!-- Top face - left vertical stroke -->
    <polygon points="400,180 460,140 620,140 560,180 400,180"
             fill="url(#topFace)"/>

    <!-- Top face - inner step -->
    <polygon points="560,340 620,300 620,140 560,180 560,340"
             fill="#4A9BAD" opacity="0.7"/>

    <!-- Top face - right vertical top -->
    <polygon points="640,280 700,240 780,240 720,280 640,280"
             fill="url(#topFace)"/>

    <!-- Top face - bottom horizontal -->
    <polygon points="480,640 540,600 720,600 780,540 720,580 640,640 480,640"
             fill="#4A9BAD" opacity="0.5"/>

    <!-- Inner recessed top face -->
    <polygon points="480,340 540,300 620,300 560,340 480,340"
             fill="url(#innerShadow)"/>

    <!-- Inner recessed area (dark cavity) -->
    <polygon points="480,340 480,580 560,580 560,340 480,340"
             fill="url(#deepShadow)"/>

    <!-- Inner right wall -->
    <polygon points="560,340 620,300 620,540 560,580 560,340"
             fill="#1A3040"/>

    <!-- Inner bottom -->
    <polygon points="480,580 540,540 620,540 560,580 480,580"
             fill="#0F2030"/>

    <!-- Left side face of the J -->
    <polygon points="340,220 400,180 400,640 340,680 340,220"
             fill="url(#sideFace)"/>

    <!-- Top face extended -->
    <polygon points="340,220 400,180 460,140 400,180 340,220"
             fill="url(#topFace)"/>

    <!-- Bottom left face -->
    <polygon points="400,640 460,680 540,680 480,640 400,640"
             fill="url(#sideFace)" opacity="0.8"/>

    <!-- Bottom face of horizontal -->
    <polygon points="480,640 540,680 720,680 780,620 720,640 480,640"
             fill="#3D8899" opacity="0.6"/>

    <!-- Highlight edges for depth -->
    <line x1="400" y1="180" x2="560" y2="180" stroke="#B0E8F4" stroke-width="1.5" opacity="0.4"/>
    <line x1="640" y1="280" x2="720" y2="280" stroke="#B0E8F4" stroke-width="1.5" opacity="0.4"/>
    <line x1="400" y1="180" x2="400" y2="640" stroke="#B0E8F4" stroke-width="1" opacity="0.2"/>
  </g>
</svg>
